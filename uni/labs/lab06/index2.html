<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Внутрішні стилі</title>

  <style>
    p{
      color: red;
    }
    div{
      color: green;
    }
  </style>
</head>
<body>
  <p>CSS відповідає за те, як виглядає сторінка.</p>
  <p>HTML задає структуру, CSS — оформлення.</p>

  <div>Стилі можна підключити трьома способами.</div>
  <div>Зовнішній файл, тег style або атрибут style.</div>

  <div>
    <p>Внутрішні стилі пишуть у тезі style всередині head.</p>
  </div>
</body>
</html>
